<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Embedded Web Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      width: 90%;
      text-align: center;
    }
    .badge {
      background: #22c55e22;
      color: #22c55e;
      border: 1px solid #22c55e44;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p  { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
    }
    .info-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px 16px;
    }
    .info-item .label { font-size: 11px; color: #64748b; text-transform: uppercase; }
    .info-item .value { font-size: 14px; font-weight: 600; color: #38bdf8; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">● ONLINE</span>
    <h1>ESP32 HTTP Server</h1>
    <p>Лабораторна робота №1 — статична сторінка зі SPIFFS Flash-пам'яті</p>
    <div class="info-grid">
      <div class="info-item">
        <div class="label">Платформа</div>
        <div class="value">ESP32</div>
      </div>
      <div class="info-item">
        <div class="label">Протокол</div>
        <div class="value">HTTP/1.1</div>
      </div>
      <div class="info-item">
        <div class="label">Файлова система</div>
        <div class="value">SPIFFS</div>
      </div>
      <div class="info-item">
        <div class="label">Порт</div>
        <div class="value">80</div>
      </div>
    </div>
  </div>
</body>
</html>
